name: Build

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build desktop solution
        run: dotnet build NextCloudShot.sln --configuration Release
      - name: Publish Windows desktop artifact
        shell: pwsh
        run: ./tools/publish-desktop-win-x64.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nextcloudshot-desktop-win-x64
          path: artifacts/desktop-win-x64/

  nextcloud-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NextCloudShot.NextcloudApp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NextCloudShot.NextcloudApp/package-lock.json
      - name: Install and build Vue application
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Lint PHP syntax
        run: find lib appinfo templates -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Package Nextcloud app
        shell: pwsh
        working-directory: .
        run: ./tools/package-nextcloud-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nextcloudshot-nextcloud-app
          path: artifacts/nextcloudshot.tar.gz
