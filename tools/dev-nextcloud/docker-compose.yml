services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud-dev-password
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nextcloud:
    image: nextcloud:33-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud-dev-password
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    volumes:
      - nextcloud:/var/www/html
      - ../../NextCloudShot.NextcloudApp:/var/www/html/custom_apps/nextcloudshot

volumes:
  db:
  nextcloud:
